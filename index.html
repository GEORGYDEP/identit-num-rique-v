<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAA4 Quest | L'Odyssée Numérique</title>
    
    <!-- INFRASTRUCTURE MODULAIRE -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            animation: {
              'mesh': 'mesh 15s ease infinite alternate',
              'glow': 'glow 4s ease-in-out infinite',
              'shake': 'shake 0.4s ease-in-out',
            },
            keyframes: {
              mesh: {
                '0%': { transform: 'scale(1) translate(0%, 0%)' },
                '50%': { transform: 'scale(1.2) translate(5%, 5%)' },
                '100%': { transform: 'scale(1) translate(0%, 0%)' },
              },
              glow: {
                '0%, 100%': { opacity: '0.4', filter: 'blur(20px)' },
                '50%': { opacity: '0.8', filter: 'blur(40px)' },
              },
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-10px)' },
                '75%': { transform: 'translateX(10px)' },
              }
            }
          }
        }
      }
    </script>

    <style>
        body { 
            background-color: #030712; 
            color: #f8fafc; 
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(234, 88, 12, 0.05) 0%, transparent 50%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .title-gradient {
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="mesh-bg animate-mesh"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
